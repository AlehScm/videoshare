name: Release do app de desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
      # Uma release só: o publish do electron-builder envia em paralelo e às vezes cria duas.
      # O latest.yml é o que a atualização automática dos apps instalados consulta.
      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          release/videoshare-setup-*.exe
          release/videoshare-setup-*.exe.blockmap
          release/latest.yml
          --title "videoshare $GITHUB_REF_NAME"
          --notes "Instalador do app de desktop pra Windows."
